repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: eslint --fix
        language: node
        files: \.([cm]?js|ts)$
        exclude: ^octoprint_prettygcode/static/js/.*\.bundle\.js$
        additional_dependencies:
          - eslint@9.39.5
          - neostandard@0.13.0

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--target-version=py37]
      - id: ruff-format

  - repo: https://github.com/djlint/djLint
    rev: v1.43.1
    hooks:
      - id: djlint-reformat-jinja
      - id: djlint-jinja

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
        - tomli

  - repo: local
    hooks:
      - id: install-frontend
        name: install frontend
        entry: npm install
        language: system
        files: ^(frontend/|package(-lock)?\.json|octoprint_prettygcode/static/js/.*\.bundle\.js)
        pass_filenames: false

      - id: build-frontend
        name: build frontend
        entry: npm run build
        language: system
        files: ^(frontend/|package(-lock)?\.json|octoprint_prettygcode/static/js/.*\.bundle\.js)
        pass_filenames: false
